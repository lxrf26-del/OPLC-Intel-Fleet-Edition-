name: Build Intel Fleet Edition App

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch: 

jobs:
  build-macos:
    runs-on: macos-14 
    
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: Install Dependencies
      run: |
        python3 -m pip install --upgrade pip
        pip3 install -r requirements.txt

    - name: Build Application Bundle
      run: |
        # Force the script to execute the app bundling sequence
        python3 OpenCore-Patcher-GUI.command --build-app
      continue-on-error: true

    - name: Locate and Move the App Bundle
      run: |
        # Creates a dedicated folder and hunts down the built .app
        mkdir -p output
        find . -name "*.app" -maxdepth 3 -exec cp -R {} ./output/ \;
        ls -la output/

    - name: Upload Compiled Artifact
      uses: actions/upload-artifact@v4
      with:
        name: OCLP-Intel-Fleet-Edition-v1.0.0
        path: output/
        if-no-files-found: error # This will force a clear error log if the file isn't built
