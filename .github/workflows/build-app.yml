name: Build Intel Fleet Edition App

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch: # Allows you to manually trigger the build anytime

jobs:
  build-macos:
    runs-on: macos-14 # Uses a modern macOS runner to compile the binary
    
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: Install Dependencies
      run: |
        python3 -m pip install --upgrade pip
        pip3 install -r requirements.txt

    - name: Build Application Bundle
      run: |
        # Runs the official compilation script built into OCLP
        python3 OpenCore-Patcher-GUI.command --build-app
      continue-on-error: true

    - name: Upload Compiled Artifact
      uses: actions/upload-artifact@v4
      with:
        name: OCLP-Intel-Fleet-Edition-v1.0.0
        path: dist/OpenCore-Patcher.app
        if-no-files-found: warn
